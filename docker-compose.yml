services:
  postgres:
    image: postgres:18-alpine
    container_name: microvault-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:?You must provide the 'DB_USER' variable in the .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?You must provide the 'DB_PASSWORD' variable in the .env file}
      POSTGRES_DB: ${DB_NAME:?You must provide the 'DB_NAME' variable in the .env file}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      microvault-credit:
        ipv4_address: 172.20.0.4

  redis:
    image: redis:7-alpine
    container_name: microvault-redis
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD:?You must provide the 'REDIS_PASSWORD' variable in the .env file} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - microvault-credit

  migrate:
    build:
      context: ..
      dockerfile: microvault-credit/Dockerfile.dev
    container_name: microvault-migrate
    working_dir: /app/microvault-credit
    command: go run cmd/migrate/main.go up
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../:/app
      - go-mod-cache:/go/pkg/mod
    restart: "no"
    networks:
      - microvault-credit

  docs:
    build:
      context: ..
      dockerfile: microvault-credit/Dockerfile.dev
    container_name: microvault-docs
    working_dir: /app/microvault-credit
    command: sh -c "sh scripts/generate-core-docs.sh && sh scripts/generate-credit-docs.sh"
    volumes:
      - ../:/app
      - go-mod-cache:/go/pkg/mod
    restart: "no"

  credit-with-air:
    build:
      context: ..
      dockerfile: microvault-credit/Dockerfile.dev
    working_dir: /app/microvault-credit
    command: sh -c "mkdir -p tmp/credit && air -c .air-credit.toml"
    ports:
      - "8081:8081"
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      docs:
        condition: service_completed_successfully
    volumes:
      - ../:/app
      - ../microvault:/microvault
      - go-mod-cache:/go/pkg/mod
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8081/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - microvault-credit

  admin-with-air:
    build:
      context: ..
      dockerfile: microvault-credit/Dockerfile.dev
    container_name: microvault-admin
    working_dir: /app/microvault-credit
    # Builds CSS and generates templ once, then runs the server directly — no
    # air, no `tailwindcss --watch`. That combination self-triggered a rebuild
    # loop (air watches internal/, which includes both templ's own generated
    # _templ.go output and tailwind's own admin.css output, each rewrite
    # re-queuing another air rebuild) and the server never stayed up long
    # enough to accept a connection. Restart the container to pick up changes.
    command: >
      sh -c "cd internal/admin/assets && npm install --silent &&
             npx tailwindcss -i input.css -o ../static/admin.css &&
             cd /app/microvault-credit && go tool templ generate &&
             go run ./cmd/admin"
    ports:
      - "8090:8090"
    env_file: .env
    environment:
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 8090
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ../:/app
      - ../microvault:/microvault
      - go-mod-cache:/go/pkg/mod
      # Shadows the host's node_modules: Tailwind ships native binaries and the
      # host is glibc while this image is musl, so they cannot be shared.
      - admin-node-modules:/app/microvault-credit/internal/admin/assets/node_modules
    networks:
      - microvault-credit

networks:
  microvault-credit:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  go-mod-cache:
  admin-node-modules:
