services:
  postgres:
    image: postgres:18-alpine
    container_name: microvault-postgres
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:?You must provide the 'DB_USER' variable in the .env file}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?You must provide the 'DB_PASSWORD' variable in the .env file}
      POSTGRES_DB: ${DB_NAME:?You must provide the 'DB_NAME' variable in the .env file}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: microvault-redis
    env_file: .env
    command: redis-server --requirepass ${REDIS_PASSWORD:?You must provide the 'REDIS_PASSWORD' variable in the .env file} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: microvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:-my-minio-key:h8gBExLSiqmGky62m8lPyBbAmyymT/7Wb4/emV50KEo=}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  migrate:
    build:
      context: ..
      dockerfile: microvault-credit/Dockerfile.migrate
    container_name: microvault-migrate
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  core:
    build:
      context: ..
      dockerfile: microvault-credit/core/Dockerfile
    container_name: microvault-core
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - core_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  credit:
    build:
      context: ..
      dockerfile: microvault-credit/credit/Dockerfile
    container_name: microvault-credit
    env_file: .env
    ports:
      - "8081:8081"
    depends_on:
      migrate:
        condition: service_completed_successfully
      core:
        condition: service_healthy
    volumes:
      - credit_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
  credit_data:
  core_data:
  minio_data:
