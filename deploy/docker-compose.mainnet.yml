# Canonical mainnet stack.

x-backend-environment: &backend-environment
  SERVER_ENVIRONMENT: production
  SERVER_HOST: 0.0.0.0
  CORE_SERVER_PORT: "8080"
  CREDIT_SERVER_PORT: "8081"
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
  LOG_LEVEL: ${LOG_LEVEL:-info}

  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${DB_USER:?}
  DB_PASSWORD: ${DB_PASSWORD:?}
  DB_NAME: ${DB_NAME:?}
  DB_SSL_MODE: ${DB_SSL_MODE:-disable}
  DB_TIMEZONE: ${DB_TIMEZONE:-UTC}

  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:?}
  REDIS_DB_NUMBER: ${REDIS_DB_NUMBER:-0}
  REDIS_IDEMPOTENCY_TTL: ${REDIS_IDEMPOTENCY_TTL:-86400}

  STELLAR_RPC_URL: ${STELLAR_RPC_URL:?}
  USDC_ISSUER: ${USDC_ISSUER:?}
  CONTRACT_ID: ${CONTRACT_ID:?}
  TREASURY_SECRET_KEY: ${TREASURY_SECRET_KEY:?}
  ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:?}
  SERVER_SECRET_KEY: ${SERVER_SECRET_KEY:?}
  JWT_SECRET: ${JWT_SECRET:?}

  ENABLE_MULTI_SIG: ${ENABLE_MULTI_SIG:?}
  MULTI_SIG_LOW_THRESHOLD: ${MULTI_SIG_LOW_THRESHOLD:?}
  MULTI_SIG_MEDIUM_THRESHOLD: ${MULTI_SIG_MEDIUM_THRESHOLD:?}
  MULTI_SIG_HIGH_THRESHOLD: ${MULTI_SIG_HIGH_THRESHOLD:?}

  YELLOW_CARD_PUBLIC_KEY: ${YELLOW_CARD_PUBLIC_KEY:?}
  YELLOW_CARD_SECRET_KEY: ${YELLOW_CARD_SECRET_KEY:?}
  YELLOW_CARD_BUSINESS_ID: ${YELLOW_CARD_BUSINESS_ID:?}
  YELLOW_CARD_BUSINESS_NAME: ${YELLOW_CARD_BUSINESS_NAME:?}
  YELLOW_CARD_BASE_URL: ${YELLOW_CARD_BASE_URL:-}
  YELLOW_CARD_WEBHOOK_SECRET: ${YELLOW_CARD_WEBHOOK_SECRET:-}

  FONBNK_CLIENT_ID: ${FONBNK_CLIENT_ID:?}
  FONBNK_CLIENT_SECRET: ${FONBNK_CLIENT_SECRET:?}
  FONBNK_BASE_URL: ${FONBNK_BASE_URL:-}

  MONEYGRAM_HOME_DOMAIN: ${MONEYGRAM_HOME_DOMAIN:?}
  MONEYGRAM_SERVER_SIGNING_KEY: ${MONEYGRAM_SERVER_SIGNING_KEY:?}
  MONEYGRAM_USDC_ISSUER: ${MONEYGRAM_USDC_ISSUER:-}
  MONEYGRAM_TRANSFER_SERVER_URL: ${MONEYGRAM_TRANSFER_SERVER_URL:-}
  MONEYGRAM_CLIENT_ID: ${MONEYGRAM_CLIENT_ID:-}
  MONEYGRAM_CLIENT_SECRET: ${MONEYGRAM_CLIENT_SECRET:-}
  MONEYGRAM_OAUTH_URL: ${MONEYGRAM_OAUTH_URL:-}
  MONEYGRAM_FX_RATE_URL: ${MONEYGRAM_FX_RATE_URL:-}
  MONEYGRAM_AUTH_SECRET: ${MONEYGRAM_AUTH_SECRET:?}
  MONEYGRAM_FUNDS_SECRET: ${MONEYGRAM_FUNDS_SECRET:?}
  MONEYGRAM_POLL_INTERVAL: ${MONEYGRAM_POLL_INTERVAL:-}
  MONEYGRAM_POLL_MAX_BATCH: ${MONEYGRAM_POLL_MAX_BATCH:-}
  MONEYGRAM_REFUND_MAX_ATTEMPTS: ${MONEYGRAM_REFUND_MAX_ATTEMPTS:-}
  MONEYGRAM_FX_ENTRY_BUFFER_PCT: ${MONEYGRAM_FX_ENTRY_BUFFER_PCT:-}
  MONEYGRAM_FX_ENTRY_BUFFER_PCT_FALLBACK: ${MONEYGRAM_FX_ENTRY_BUFFER_PCT_FALLBACK:-}
  LOAN_ENTRY_FX_BUFFER_PCT: ${LOAN_ENTRY_FX_BUFFER_PCT:-}

  AT_USERNAME: ${AT_USERNAME:-}
  AT_API_KEY: ${AT_API_KEY:?}
  AT_SANDBOX_MODE: "false"
  AT_BASE_URL: ${AT_BASE_URL:-}
  AT_SENDER_ID: ${AT_SENDER_ID:-}
  AT_SHORTCODE: ${AT_SHORTCODE:-}
  AT_HTTP_TIMEOUT: ${AT_HTTP_TIMEOUT:-}
  USSD_DIAL_STRING: ${USSD_DIAL_STRING:?}
  USSD_SESSION_TIMEOUT: ${USSD_SESSION_TIMEOUT:-}
  PIN_LOCKOUT_SECONDS: ${PIN_LOCKOUT_SECONDS:-}

  DUB_API_KEY: ${DUB_API_KEY:-}
  DUB_API_URL: ${DUB_API_URL:-}
  DUB_DOMAIN: ${DUB_DOMAIN:-}
  DUB_PREVIEW_TITLE: ${DUB_PREVIEW_TITLE:-}
  DUB_PREVIEW_DESCRIPTION: ${DUB_PREVIEW_DESCRIPTION:-}
  DUB_IMAGE_PREVIEW_URL: ${DUB_IMAGE_PREVIEW_URL:-}

  ACCOUNT_INDEX_BASE: ${ACCOUNT_INDEX_BASE:-10}
  LOAN_REFERENCE_PREFIX: ${LOAN_REFERENCE_PREFIX:-}
  ROUND_ANCHOR_AMOUNTS: ${ROUND_ANCHOR_AMOUNTS:-}
  ENABLE_PAYMENT_PROVIDER_RELAY_SWITCH: ${ENABLE_PAYMENT_PROVIDER_RELAY_SWITCH:-}

  MPESA_CONSUMER_KEY: ${MPESA_CONSUMER_KEY:-}
  MPESA_CONSUMER_SECRET: ${MPESA_CONSUMER_SECRET:-}
  MPESA_PASSKEY: ${MPESA_PASSKEY:-}
  MPESA_INITIATOR_NAME: ${MPESA_INITIATOR_NAME:-}
  MPESA_INITIATOR_PASSWORD: ${MPESA_INITIATOR_PASSWORD:-}
  MPESA_COLLECTION_SHORTCODE: ${MPESA_COLLECTION_SHORTCODE:-}
  MPESA_DISBURSEMENT_SHORTCODE: ${MPESA_DISBURSEMENT_SHORTCODE:-}
  MPESA_CALLBACK_BASE_URL: ${MPESA_CALLBACK_BASE_URL:-}
  MPESA_CALLBACK_SLUG: ${MPESA_CALLBACK_SLUG:-}
  MPESA_CALLBACK_ALLOWED_CIDRS: ${MPESA_CALLBACK_ALLOWED_CIDRS:-}
  MPESA_STK_POLL_INTERVAL: ${MPESA_STK_POLL_INTERVAL:-}
  MPESA_STK_MAX_ATTEMPTS: ${MPESA_STK_MAX_ATTEMPTS:-}
  MPESA_SETTLEMENT_MODE: ${MPESA_SETTLEMENT_MODE:-}

  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: com.docker.compose.service,com.docker.compose.project

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
      PGDATA: /var/lib/postgresql/18/data
    volumes:
      - postgres_data:/var/lib/postgresql/18/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
      shared-db-network:
        aliases:
          - microvault-pg-mainnet
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  redis:
    image: redis:8
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 320M
    logging: *logging

  migrate:
    image: ${MIGRATE_IMAGE:?}
    restart: "no"
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  credit:
    image: ${CREDIT_IMAGE:?}
    restart: unless-stopped
    environment:
      <<: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *logging

  web:
    image: ${WEB_IMAGE:?}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 64M
    logging: *logging

  openobserve:
    image: openobserve/openobserve:v1.0.4
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?}
      ZO_DATA_DIR: /data
      ZO_TELEMETRY: "false"
      ZO_LOCAL_MODE: "true"
      ZO_LOCAL_MODE_STORAGE: s3
      ZO_S3_PROVIDER: s3
      ZO_S3_SERVER_URL: ${ZO_S3_SERVER_URL:?}
      ZO_S3_REGION_NAME: auto
      ZO_S3_BUCKET_NAME: ${ZO_S3_BUCKET_NAME:?}
      ZO_S3_BUCKET_PREFIX: ${ZO_S3_BUCKET_PREFIX:-mainnet/}
      ZO_S3_ACCESS_KEY: ${ZO_S3_ACCESS_KEY:?}
      ZO_S3_SECRET_KEY: ${ZO_S3_SECRET_KEY:?}
      ZO_COMPACT_DATA_RETENTION_DAYS: ${ZO_COMPACT_DATA_RETENTION_DAYS:-90}
      ZO_MEMORY_CACHE_MAX_SIZE: "256"
      ZO_DISK_CACHE_MAX_SIZE: "2048"
    volumes:
      - openobserve_data:/data
    deploy:
      resources:
        limits:
          memory: 1G
    logging: *logging

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:?}
    restart: unless-stopped
    user: "0:0"
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:?}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?}
    volumes:
      - ${DOCKER_ROOT_DIR:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /:/hostfs:ro
      - otel_collector_data:/var/lib/otelcol
    depends_on:
      - openobserve
    deploy:
      resources:
        limits:
          memory: 256M
    logging: *logging

networks:
  shared-db-network:
    external: true

volumes:
  postgres_data:
  redis_data:
  openobserve_data:
  otel_collector_data:
