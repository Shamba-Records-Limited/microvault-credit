root = "."
tmp_dir = "tmp/credit"

[build]
  bin = "./tmp/credit/main"
  cmd = "go build -o ./tmp/credit/main ./cmd/credit/main.go"
  exclude_dir = ["tmp", "vendor", "core", "cmd/credit/docs"]
  include_dir = ["credit", "cmd/credit", "/microvault/pkg"]
  include_ext = ["go", "toml", "yaml", "yml", "json"]
  delay = 1000
