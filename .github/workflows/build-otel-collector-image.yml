name: Build OTel Collector Image

on:
  workflow_dispatch:
  push:
    branches: ["testnet"]
    paths:
      - "deploy/otel-collector/**"
      - ".github/workflows/build-otel-collector-image.yml"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve image namespace
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: vars
        run: echo "sha7=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push otel-collector
        uses: docker/build-push-action@v7
        with:
          context: deploy/otel-collector
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/otel-collector:testnet-${{ steps.vars.outputs.sha7 }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/otel-collector:testnet-latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/otel-collector:testnet-${{ steps.vars.outputs.sha7 }}`'
          } >> "$GITHUB_STEP_SUMMARY"
