name: Build OutRay Image

on:
  workflow_dispatch:
    inputs:
      outray_version:
        description: outray npm version to pin
        required: true
        default: "0.1.3"
  push:
    branches: ["testnet"]
    paths:
      - "deploy/outray/**"
      - ".github/workflows/build-outray-image.yml"

env:
  REGISTRY: ghcr.io
  DEFAULT_VERSION: "0.1.3"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Resolve image namespace
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - id: vars
        run: echo "version=${{ inputs.outray_version || env.DEFAULT_VERSION }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push outray
        uses: docker/build-push-action@v7
        with:
          context: deploy/outray
          push: true
          platforms: linux/amd64
          provenance: false
          build-args: |
            OUTRAY_VERSION=${{ steps.vars.outputs.version }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/outray:${{ steps.vars.outputs.version }}

      - name: Summary
        run: |
          {
            echo "### Image"
            echo '`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/outray:${{ steps.vars.outputs.version }}`'
          } >> "$GITHUB_STEP_SUMMARY"
